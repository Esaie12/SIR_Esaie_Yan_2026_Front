<div class="container mt-4 content">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Messages</h3>

    <!-- 🔘 ADD BUTTON déplacé ici -->
    <a routerLink="/messages-create" class="btn btn-success">
      + Créer un nouveau message
    </a>
  </div>

  <!-- 🔷 TABLE -->
  <div class="card p-3">
    <div class="table-responsive">
      <table id="myTable" class="table table-hover">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Traffic Source</th>
            <th>Source Type</th>
            <th>Category</th>
            <th>Global Rank</th>
            <th>Traffic Share</th>
            <th>Change</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let message of messages$ | async">
            <td>{{message.id}}</td>
            <td>{{message.title}}</td>
            <td>Direct</td>
            <td>-</td>
            <td>{{message.title}}</td>

            <td class="text-success">{{message.dateSend | date:'yyyy-MM-dd à HH:mm'}}</td>
            <td>
              <ng-container *ngIf="1 >3; else sent">
                <span class="text-warning">En attente</span>
              </ng-container>

              <ng-template #sent>
                <span class="text-success">Envoyé</span>
              </ng-template>
            </td>
            <td>
              <button class="btn btn-sm btn-primary">Edit</button>
              <button class="btn btn-sm btn-danger">Delete</button>
            </td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>

</div>
