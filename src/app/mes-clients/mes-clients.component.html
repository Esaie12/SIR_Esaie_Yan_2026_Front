<div class="container mt-4 content">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Mes clients</h3>

    <!-- 🔘 ADD BUTTON déplacé ici -->
    <a class="btn btn-success" routerLink="/clients-create">+ Créer un nouveau client</a>
  </div>

  <!-- 🔷 TABLE -->
  <div class="card p-3">
    <div class="table-responsive">
      <table id="myTable" class="table table-hover">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Pays</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let customer of customers$ | async; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ customer.name }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.phone }}</td>
            <td>{{ customer.country }}</td>
            <td>
              <a [routerLink]="['/clients/edit', customer.id]" class="btn btn-sm btn-primary">
                Modifier
              </a>
              <button class="btn btn-sm btn-danger">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
