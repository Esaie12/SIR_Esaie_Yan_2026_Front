<div class="container mt-4">

  <!-- SPINNER pendant le chargement -->
  <ng-container *ngIf="isLoading">
    <div class="flex justify-center items-center min-h-[300px]">
      <div class="w-16 h-16 border-4 border-rose-300/30 border-t-rose-500 rounded-full animate-spin"></div>
    </div>
  </ng-container>

  <!-- CONTENU une fois le groupe chargé -->
  <div class="row g-4" *ngIf="!isLoading && groupe">

    <div class="col-12">
      <h2>Gerer la catégorie <u [style.color]="groupe.color">{{ groupe.libelle }}</u></h2>
    </div>

    <!-- 📝 FORMULAIRE MODIFICATION -->
    <div class="col-md-4">
      <div class="card p-3">
        <h5 class="mb-3">Modifier la catégorie</h5>

        <form (ngSubmit)="updateGroup()" #form="ngForm">

          <div class="mb-3">
            <label class="form-label">Libellé</label>
            <input type="text"
                   class="form-control"
                   [(ngModel)]="groupeData.libelle"
                   name="libelle"
                   required>
          </div>

          <div class="mb-3">
            <label class="form-label">Couleur</label>
            <input type="color"
                   name="color"
                   [(ngModel)]="groupeData.color"
                   class="form-control form-control-color mt-2">
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Valider la modification
          </button>

        </form>
      </div>
    </div>

    <!-- 👥 MEMBRES ACTUELS -->
    <div class="col-md-4">
      <div class="card p-3">
        <h5 class="mb-3">Membres ({{ membres.length }})</h5>

        <ul class="list-group">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              *ngFor="let membre of membres">
            {{ membre.name }}
            <button (click)="removeMembre(membre)"
                    class="btn btn-sm btn-outline-danger">
              Retirer
            </button>
          </li>
        </ul>

        <p *ngIf="!membres?.length" class="text-muted text-center mt-2">
          Aucun membre
        </p>
      </div>
    </div>

    <!-- ➕ AJOUTER DES MEMBRES -->
    <div class="col-md-4">
      <div class="card p-3">
        <h5 class="mb-3">Ajouter des membres</h5>

        <div class="list-group">
          <label class="list-group-item"
                 *ngFor="let user of usersDisponibles">
            <input class="form-check-input me-2"
                   type="checkbox"
                   [value]="user.id"
                   [checked]="selectedUsers.includes(user.id!)"
                   (change)="toggleUser(user.id!, $event)">
            {{ user.name }}
          </label>
        </div>

        <p *ngIf="!usersDisponibles?.length" class="text-muted text-center mt-2">
          Aucun utilisateur disponible
        </p>

        <button (click)="addMembers()"
                class="btn btn-success w-100 mt-3"
                [disabled]="selectedUsers.length === 0">
          Ajouter
        </button>

      </div>
    </div>

  </div>

</div>
